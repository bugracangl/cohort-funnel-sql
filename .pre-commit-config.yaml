# pre-commit hooks yapılandırması
# Kurulum: pip install pre-commit && pre-commit install
# Çalıştırma: pre-commit run --all-files

repos:
  # Ruff - Hızlı Python linter (flake8 + isort + pyupgrade + daha fazlası)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # MyPy - Static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        args: [--ignore-missing-imports, --no-error-summary]

  # Trailing whitespace ve dosya sonu newline kontrolü
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Commit mesaj formatı kontrolü (Conventional Commits)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
        args: [--check]

# Varsayılan stage: commit
default_stages: [commit]