[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cohort-funnel-sql"
version = "0.1.0"
description = "Python ve SQLite ile Ürün Analitiği: Kohort Tutundurma Matrisi ve Sıralı Dönüşüm Hunisi."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
cohort-funnel = "cohort_funnel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
